<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hana Mediabox">
  <!-- Soft app tile -->
  <rect width="64" height="64" rx="14" fill="#fff7f2"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#f0d4c8" stroke-width="1"/>

  <!-- Warm blush wash (reads as depth without blur) -->
  <circle cx="20" cy="48" r="22" fill="#f7c4b4" opacity="0.35"/>
  <circle cx="48" cy="16" r="18" fill="#f2b8c4" opacity="0.28"/>

  <!-- Sakura mark — Hana = flower. Five petals, clear at 16px. -->
  <g transform="translate(32 33)">
    <path d="M0-16c4.2 3.2 6.4 7.2 6.4 11.2C6.4-1.2 3.4 2 0 2S-6.4-1.2-6.4-4.8C-6.4-8.8-4.2-12.8 0-16z" fill="#e89aaa"/>
    <path d="M0-16c4.2 3.2 6.4 7.2 6.4 11.2C6.4-1.2 3.4 2 0 2S-6.4-1.2-6.4-4.8C-6.4-8.8-4.2-12.8 0-16z" fill="#e89aaa" transform="rotate(72)"/>
    <path d="M0-16c4.2 3.2 6.4 7.2 6.4 11.2C6.4-1.2 3.4 2 0 2S-6.4-1.2-6.4-4.8C-6.4-8.8-4.2-12.8 0-16z" fill="#e89aaa" transform="rotate(144)"/>
    <path d="M0-16c4.2 3.2 6.4 7.2 6.4 11.2C6.4-1.2 3.4 2 0 2S-6.4-1.2-6.4-4.8C-6.4-8.8-4.2-12.8 0-16z" fill="#e89aaa" transform="rotate(216)"/>
    <path d="M0-16c4.2 3.2 6.4 7.2 6.4 11.2C6.4-1.2 3.4 2 0 2S-6.4-1.2-6.4-4.8C-6.4-8.8-4.2-12.8 0-16z" fill="#e89aaa" transform="rotate(288)"/>

    <!-- Petal highlights for a little life at larger sizes -->
    <path d="M0-14c2.4 2.2 3.6 4.8 3.4 7.2" fill="none" stroke="#f6d0d8" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <path d="M0-14c2.4 2.2 3.6 4.8 3.4 7.2" fill="none" stroke="#f6d0d8" stroke-width="1.6" stroke-linecap="round" opacity="0.75" transform="rotate(72)"/>
    <path d="M0-14c2.4 2.2 3.6 4.8 3.4 7.2" fill="none" stroke="#f6d0d8" stroke-width="1.6" stroke-linecap="round" opacity="0.75" transform="rotate(144)"/>

    <!-- Center -->
    <circle r="4.2" fill="#fcd34d"/>
    <circle r="2.1" fill="#fff8e8"/>
  </g>

  <!-- Tiny leaf for media/nature balance -->
  <path d="M46 46c6-1 9 2 10 6-5 1-8-1-10-6z" fill="#8fbf9a" opacity="0.9"/>
</svg>
